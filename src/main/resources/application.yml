spring:
  application:
    name: localvault

  datasource:
    url: jdbc:postgresql://localhost:5433/localvault
    username: vault
    password: vault415
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-dev-secret-key-at-least-32-characters-long}
  access-expiration: 1800000
  refresh-expiration: 604800000

# 암호화 설정
vault:
  encryption-key: ${VAULT_ENCRYPTION_KEY:dev-encryption-key-32bytes!!}

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html